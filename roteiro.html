<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteiro Europa - Roteiro & Itinerário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta name="theme-color" content="#4c1d95">
    <style>
        button, a, label, select, input { -webkit-tap-highlight-color: transparent; }
        button:active, a:active { transform: scale(0.97); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24 select-none">

    <div id="toast-container" class="fixed top-4 right-4 z-[999] flex flex-col gap-2 pointer-events-none"></div>

    <header class="bg-slate-900 text-white px-3 py-2.5 shadow-md border-b border-slate-800 text-xs flex justify-between items-center z-50 sticky top-0">
        <span class="font-bold flex items-center gap-1.5">
            <span>✈️</span> Roteiro Oficial & Itinerário
        </span>
        <div class="flex items-center gap-1.5">
            <button onclick="adicionarBloco()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1.5 rounded-lg font-bold text-[10px] active:scale-95">➕ Novo Bloco</button>
            <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-lg font-bold text-[10px] active:scale-95">🖨️ PDF</button>
            <a href="principal.html" class="bg-slate-800 hover:bg-slate-700 text-white px-2.5 py-1.5 rounded-lg font-bold text-[10px] border border-slate-700">🏠 Início</a>
        </div>
    </header>

    <div class="max-w-4xl mx-auto p-3 sm:p-6 space-y-4 pt-4">

        <!-- Barra de Progresso e Filtros de Destino -->
        <div class="bg-white p-3.5 rounded-2xl shadow-xs border border-slate-200 flex justify-between items-center">
            <div>
                <h2 class="text-xs font-black uppercase tracking-wider text-slate-800">✈️ Destinos Aprovados</h2>
                <p class="text-[10px] text-slate-500">Marque o cadeado (🔒) no modo edição para aprovar para o roteiro oficial.</p>
            </div>
            <div id="progresso-viagem" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-black shadow-inner">0 / 0 Aprovados</div>
        </div>

        <div id="filtros-container" class="bg-slate-200/80 p-2 rounded-2xl overflow-x-auto flex gap-1.5 text-xs items-center no-scrollbar shadow-inner border border-slate-300/40"></div>

        <!-- Abas Internas: Modo Leitura vs Modo Edição -->
        <div class="flex gap-2">
            <button id="btn-modo-leitura" onclick="alternarVisao('leitura')" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-extrabold text-xs shadow-sm">📖 Visualizar Roteiro</button>
            <button id="btn-modo-edicao" onclick="alternarVisao('edicao')" class="flex-1 py-2 rounded-xl bg-white text-slate-700 font-extrabold text-xs shadow-xs border border-slate-200">✏️ Editar Percursos</button>
        </div>

        <!-- Seção 1: Visualização do Roteiro Oficial -->
        <div id="secao-leitura" class="space-y-3">
            <div id="lista-leitura-html" class="grid grid-cols-1 gap-3"></div>
        </div>

        <!-- Seção 2: Edição dos Blocos -->
        <div id="secao-edicao" class="space-y-3 hidden">
            <div id="lista-blocos" class="space-y-3"></div>
        </div>
    </div>

    <!-- NAVEGAÇÃO FIXA INFERIOR -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md text-white px-3 py-2 shadow-2xl border-t border-slate-800 flex items-center justify-around gap-1 max-w-4xl mx-auto rounded-t-2xl">
        <a href="principal.html" class="py-1 px-3 rounded-xl hover:bg-slate-800 text-slate-300 font-extrabold text-[11px] flex flex-col items-center">
            <span>🏠</span><span class="text-[9px]">Início</span>
        </a>
        <a href="roteiro.html" class="py-1 px-3 rounded-xl bg-indigo-600 text-white font-extrabold text-[11px] flex flex-col items-center">
            <span>✈️</span><span class="text-[9px]">Roteiro</span>
        </a>
        <a href="hub.html" class="py-1 px-3 rounded-xl hover:bg-slate-800 text-slate-300 font-extrabold text-[11px] flex flex-col items-center">
            <span>📋</span><span class="text-[9px]">Hub</span>
        </a>
        <a href="orcamento.html" class="py-1 px-3 rounded-xl hover:bg-slate-800 text-slate-300 font-extrabold text-[11px] flex flex-col items-center">
            <span>💰</span><span class="text-[9px]">Orçamento</span>
        </a>
        <a href="compras.html" class="py-1 px-3 rounded-xl hover:bg-slate-800 text-slate-300 font-extrabold text-[11px] flex flex-col items-center">
            <span>🛍️</span><span class="text-[9px]">Compras</span>
        </a>
    </nav>

    <script>
        const SUPABASE_URL = 'https://jmeepzdvmmjngxwvayqb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_54ORrLbP7naW7n-KlKCdUA_hZnpjguH';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const CHAVE_APP = "mariana_viagem_europa_dados_fixos_definitiva";

        let destinoFiltro = 'todos';
        let dadosApp = {
            destinosCadastrados: ["Zurique", "Freiburg", "França", "Interlaken", "Disney"],
            coresDestinos: { "Zurique": "#3b82f6", "Freiburg": "#f59e0b", "França": "#ec4899", "Interlaken": "#10b981", "Disney": "#8b5cf6" },
            itinerario: []
        };

        function mostrarToast(msg, tipo = 'sucesso') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `bg-emerald-600 text-white px-4 py-2 rounded-2xl shadow-xl font-bold text-xs pointer-events-auto`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        async function salvarStorage() {
            localStorage.setItem(CHAVE_APP, JSON.stringify(dadosApp));
            try {
                await supabaseClient.from('app_dados').upsert({ id: '1', conteudo: dadosApp });
            } catch(e){}
        }

        async function carregarDados() {
            try {
                let { data } = await supabaseClient.from('app_dados').select('conteudo').eq('id', '1').single();
                if (data && data.conteudo) dadosApp = data.conteudo;
                else {
                    let local = localStorage.getItem(CHAVE_APP);
                    if (local) dadosApp = JSON.parse(local);
                }
            } catch(e) {
                let local = localStorage.getItem(CHAVE_APP);
                if (local) dadosApp = JSON.parse(local);
            }
            renderizarTudo();
        }

        function alternarVisao(modo) {
            if (modo === 'leitura') {
                document.getElementById('secao-leitura').classList.remove('hidden');
                document.getElementById('secao-edicao').classList.add('hidden');
                document.getElementById('btn-modo-leitura').className = "flex-1 py-2 rounded-xl bg-indigo-600 text-white font-extrabold text-xs shadow-sm";
                document.getElementById('btn-modo-edicao').className = "flex-1 py-2 rounded-xl bg-white text-slate-700 font-extrabold text-xs shadow-xs border border-slate-200";
            } else {
                document.getElementById('secao-leitura').classList.add('hidden');
                document.getElementById('secao-edicao').classList.remove('hidden');
                document.getElementById('btn-modo-edicao').className = "flex-1 py-2 rounded-xl bg-indigo-600 text-white font-extrabold text-xs shadow-sm";
                document.getElementById('btn-modo-leitura').className = "flex-1 py-2 rounded-xl bg-white text-slate-700 font-extrabold text-xs shadow-xs border border-slate-200";
            }
        }

        function renderizarTudo() {
            renderizarFiltros();
            renderizarLeitura();
            renderizarEdicao();
        }

        function renderizarFiltros() {
            const container = document.getElementById('filtros-container');
            if (!container) return;
            let html = `<button onclick="filtrarDestino('todos')" class="px-3 py-1.5 ${destinoFiltro==='todos'?'bg-indigo-600 text-white font-bold':'bg-white text-slate-700 font-semibold'} rounded-xl text-xs shrink-0">Todos</button>`;
            (dadosApp.destinosCadastrados || []).forEach(d => {
                let ativo = destinoFiltro === d;
                let cor = dadosApp.coresDestinos[d] || '#6366f1';
                html += `<button onclick="filtrarDestino('${d}')" style="background-color:${cor};" class="px-3 py-1.5 text-white font-bold rounded-xl text-xs shrink-0 ${ativo?'ring-2 ring-slate-900 scale-105':''}">${d}</button>`;
            });
            container.innerHTML = html;
        }

        function filtrarDestino(d) {
            destinoFiltro = d;
            renderizarTudo();
        }

        function renderizarLeitura() {
            const container = document.getElementById('lista-leitura-html');
            if (!container) return;
            container.innerHTML = '';

            let aprovados = (dadosApp.itinerario || []).filter(b => b.bloqueado);
            if (destinoFiltro !== 'todos') aprovados = aprovados.filter(b => b.categoria === destinoFiltro);

            document.getElementById('progresso-viagem').innerText = `${aprovados.length} / ${(dadosApp.itinerario||[]).length} Aprovados`;

            if (aprovados.length === 0) {
                container.innerHTML = '<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border border-slate-200">Nenhum bloco aprovado ainda. Vá em "Editar Percursos" e clique em 🔒 para aprovar.</div>';
                return;
            }

            aprovados.forEach(b => {
                let card = document.createElement('div');
                card.className = "bg-white p-4 rounded-3xl border border-slate-200 shadow-sm space-y-3";
                let cor = dadosApp.coresDestinos[b.categoria] || '#6366f1';
                card.style.borderLeft = `6px solid ${cor}`;

                let trechosHtml = (b.trechos || []).map((t, idx) => `
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-1.5 text-xs">
                        <div class="font-bold text-slate-800">Etapa ${idx+1}: ${t.origem || 'Início'} ➔ ${t.destino || 'Destino'}</div>
                        ${(t.conducoes||[]).map(c => `<div class="text-[11px] text-indigo-700 font-semibold">• ${c.transporte} ${c.valor ? `(${c.valor} ${c.moeda})` : ''} ${c.notas ? `- ${c.notas}` : ''}</div>`).join('')}
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <span class="font-black px-2.5 py-1 rounded-xl text-xs text-white" style="background-color:${cor}">${b.categoria}</span>
                        <span class="text-xs font-bold text-slate-500">📅 ${b.dataInicio || '?'} a ${b.dataFim || '?'}</span>
                    </div>
                    <div class="space-y-2">${trechosHtml || '<p class="text-xs text-slate-400">Sem trechos definidos.</p>'}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderizarEdicao() {
            const container = document.getElementById('lista-blocos');
            if (!container) return;
            container.innerHTML = '';

            let blocos = dadosApp.itinerario || [];
            if (destinoFiltro !== 'todos') blocos = blocos.filter(b => b.categoria === destinoFiltro);

            blocos.forEach((b, idx) => {
                let card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3";
                let cor = dadosApp.coresDestinos[b.categoria] || '#6366f1';

                card.innerHTML = `
                    <div class="flex justify-between items-center gap-2 flex-wrap border-b pb-2">
                        <div class="flex items-center gap-2">
                            <span class="font-black px-2.5 py-1 rounded-xl text-xs text-white" style="background-color:${cor}">${b.categoria}</span>
                            <button onclick="alternarBloqueio('${b.id}')" class="px-2.5 py-1 rounded-xl text-xs font-bold ${b.bloqueado ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'}">
                                ${b.bloqueado ? '🔒 Aprovado' : '🔓 Em Edição'}
                            </button>
                        </div>
                        <button onclick="excluirBloco('${b.id}')" class="text-rose-600 hover:text-rose-800 text-xs font-bold">✕ Excluir</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500">Data Início</label>
                            <input type="date" value="${b.dataInicio||''}" onchange="atualizarData('${b.id}', 'dataInicio', this.value)" class="w-full p-2 bg-slate-50 border rounded-xl">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500">Data Fim</label>
                            <input type="date" value="${b.dataFim||''}" onchange="atualizarData('${b.id}', 'dataFim', this.value)" class="w-full p-2 bg-slate-50 border rounded-xl">
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function adicionarBloco() {
            let cat = prompt("Qual a cidade/destino do bloco?", "Zurique");
            if (!cat) return;
            if (!dadosApp.destinosCadastrados.includes(cat)) dadosApp.destinosCadastrados.push(cat);
            if (!dadosApp.coresDestinos[cat]) dadosApp.coresDestinos[cat] = "#4f46e5";

            dadosApp.itinerario.unshift({
                id: Date.now(),
                categoria: cat,
                dataInicio: "",
                dataFim: "",
                bloqueado: false,
                trechos: [{ id: Date.now() + 1, origem: "", destino: "", conducoes: [{ id: Date.now() + 2, transporte: "Trem", valor: 0, moeda: "EUR" }] }]
            });
            salvarStorage();
            renderizarTudo();
            mostrarToast("Bloco criado com sucesso!");
        }

        function alternarBloqueio(id) {
            let b = dadosApp.itinerario.find(item => String(item.id) === String(id));
            if (b) {
                b.bloqueado = !b.bloqueado;
                salvarStorage();
                renderizarTudo();
                mostrarToast(b.bloqueado ? "Bloco aprovado para o Roteiro Oficial! 🔒" : "Bloco retornado para edição.");
            }
        }

        function atualizarData(id, campo, val) {
            let b = dadosApp.itinerario.find(item => String(item.id) === String(id));
            if (b) {
                b[campo] = val;
                salvarStorage();
            }
        }

        function excluirBloco(id) {
            if (confirm("Excluir este bloco de viagem?")) {
                dadosApp.itinerario = dadosApp.itinerario.filter(item => String(item.id) !== String(id));
                salvarStorage();
                renderizarTudo();
                mostrarToast("Bloco removido.", "info");
            }
        }

        window.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
