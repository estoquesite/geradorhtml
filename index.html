<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicador de Melhorias em HTML</title>
    <!-- Tailwind CSS para um design moderno e limpo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
            }
          }
        }
      }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-full flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/60 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-brand-600/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-white">Aplicador de Melhorias HTML</h1>
                    <p class="text-xs text-slate-400">Insira seu código base e as melhorias para gerar a versão final</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="limparTudo()" class="px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-white bg-slate-800/60 hover:bg-slate-800 rounded-lg transition border border-slate-700/50">
                    Limpar Campos
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Coluna Esquerda: Entradas (HTML Base + Melhorias) -->
        <div class="flex flex-col space-y-6">
            <!-- HTML Base -->
            <div class="bg-slate-950/40 border border-slate-800 rounded-2xl p-4 flex flex-col shadow-xl">
                <div class="flex items-center justify-between mb-2">
                    <label for="htmlInput" class="text-sm font-semibold text-slate-200 flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        <span>1. Código HTML Base</span>
                    </label>
                    <span class="text-xs text-slate-500" id="htmlStats">0 caracteres</span>
                </div>
                <textarea id="htmlInput" rows="10" placeholder="Cole aqui o seu código HTML principal..." 
                    class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm font-mono text-slate-300 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition resize-y"></textarea>
            </div>

            <!-- Lista de Melhorias -->
            <div class="bg-slate-950/40 border border-slate-800 rounded-2xl p-4 flex flex-col shadow-xl flex-1">
                <div class="flex items-center justify-between mb-2">
                    <label for="melhoriasInput" class="text-sm font-semibold text-slate-200 flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-brand-500"></span>
                        <span>2. Lista de Melhorias (1, 2, 3...)</span>
                    </label>
                    <span class="text-xs text-slate-500">Cole em lista ou texto corrido</span>
                </div>
                <textarea id="melhoriasInput" rows="8" placeholder="Ex:&#10;1. Adicionar um botão de fechar no modal&#10;2. Mudar a cor do fundo para azul escuro&#10;3. Incluir a tag meta viewport" 
                    class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-slate-300 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition resize-y flex-1"></textarea>

                <div class="mt-4">
                    <button onclick="aplicarMelhorias()" id="btnProcessar" class="w-full py-3 px-4 bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-xl shadow-lg shadow-brand-600/20 transition flex items-center justify-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                        </svg>
                        <span>Aplicar Melhorias e Gerar HTML</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Coluna Direita: Saída (HTML Total Resultante) -->
        <div class="bg-slate-950/40 border border-slate-800 rounded-2xl p-4 flex flex-col shadow-xl">
            <div class="flex items-center justify-between mb-2">
                <label for="htmlOutput" class="text-sm font-semibold text-slate-200 flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span>3. HTML Total Resultante</span>
                </label>
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-500" id="outputStats">0 caracteres</span>
                    <button onclick="copiarCodigo()" id="btnCopiar" class="px-3 py-1 text-xs font-medium text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition border border-slate-700 flex items-center space-x-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                        </svg>
                        <span>Copiar Código</span>
                    </button>
                </div>
            </div>
            <textarea id="htmlOutput" rows="20" readonly placeholder="O HTML atualizado com as melhorias aplicadas aparecerá aqui..." 
                class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm font-mono text-emerald-300 focus:outline-none transition resize-y flex-1"></textarea>
            
            <!-- Logs de Processamento -->
            <div id="logArea" class="mt-3 p-3 bg-slate-900/80 border border-slate-800/80 rounded-xl text-xs text-slate-400 font-mono hidden max-h-32 overflow-y-auto">
                <div class="font-semibold text-slate-300 mb-1">Status das modificações:</div>
                <div id="logContent"></div>
            </div>
        </div>

    </main>

    <!-- Script de lógica de processamento -->
    <script>
        const htmlInput = document.getElementById('htmlInput');
        const melhoriasInput = document.getElementById('melhoriasInput');
        const htmlOutput = document.getElementById('htmlOutput');
        const htmlStats = document.getElementById('htmlStats');
        const outputStats = document.getElementById('outputStats');
        const logArea = document.getElementById('logArea');
        const logContent = document.getElementById('logContent');

        htmlInput.addEventListener('input', () => {
            htmlStats.textContent = `${htmlInput.value.length} caracteres`;
        });

        function limparTudo() {
            htmlInput.value = '';
            melhoriasInput.value = '';
            htmlOutput.value = '';
            htmlStats.textContent = '0 caracteres';
            outputStats.textContent = '0 caracteres';
            logArea.classList.add('hidden');
            logContent.innerHTML = '';
        }

        function copiarCodigo() {
            if (!htmlOutput.value) return;
            htmlOutput.select();
            navigator.clipboard.writeText(htmlOutput.value);
            const btn = document.getElementById('btnCopiar');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span class="text-emerald-400">Copiado!</span>`;
            setTimeout(() => {
                btn.innerHTML = originalText;
            }, 2000);
        }

        function aplicarMelhorias() {
            const html = htmlInput.value.trim();
            const rawMelhorias = melhoriasInput.value.trim();

            if (!html) {
                alert('Por favor, cole o código HTML base.');
                return;
            }

            if (!rawMelhorias) {
                alert('Por favor, informe ao menos uma melhoria.');
                return;
            }

            // Separar melhorias por linhas ou numeração
            const linhas = rawMelhorias.split('\n').map(l => l.replace(/^(\d+[\.\)]\s*|-\s*|\*\s*)/, '').trim()).filter(l => l.length > 0);

            let resultado = html;
            let logs = [];

            linhas.forEach((melhoria, index) => {
                const mod = processarMelhoriaInteligente(resultado, melhoria);
                resultado = mod.novoHtml;
                logs.push(`<div class="text-emerald-400">✓ [Item ${index + 1}] ${melhoria} &rarr; <span class="text-slate-400">${mod.mensagem}</span></div>`);
            });

            htmlOutput.value = resultado;
            outputStats.textContent = `${resultado.length} caracteres`;
            
            logContent.innerHTML = logs.join('');
            logArea.classList.remove('hidden');
        }

        // Lógica heurística para localizar onde aplicar a melhoria no HTML
        function processarMelhoriaInteligente(html, melhoria) {
            let novoHtml = html;
            let msg = "Aplicado com sucesso";
            const m = melhoria.toLowerCase();

            // 1. Inserir script ou estilo antes do fechamento de </head> ou </body>
            if (m.includes('script') || m.includes('javascript') || m.includes('js')) {
                if (html.includes('</body>')) {
                    novoHtml = html.replace('</body>', `    <!-- Melhoria: ${melhoria} -->\n    <script>\n        // ${melhoria}\n    <\/script>\n</body>`);
                    msg = "Inserido antes de </body>";
                    return { novoHtml, mensagem: msg };
                }
            }

            if (m.includes('css') || m.includes('estilo') || m.includes('tailwind') || m.includes('cor') || m.includes('fonte')) {
                if (html.includes('</head>')) {
                    novoHtml = html.replace('</head>', `    <!-- Melhoria: ${melhoria} -->\n    <style>\n        /* ${melhoria} */\n    </style>\n</head>`);
                    msg = "Inserido antes de </head>";
                    return { novoHtml, mensagem: msg };
                }
            }

            // 2. Adicionar botão, elemento ou tag no final do body se falar em adicionar elemento visual
            if (m.includes('botão') || m.includes('modal') || m.includes('popup') || m.includes('footer') || m.includes('rodapé')) {
                if (html.includes('</body>')) {
                    novoHtml = html.replace('</body>', `    <!-- ${melhoria} -->\n    <div class="custom-enhancement">\n        <!-- Implementação sugerida para: ${melhoria} -->\n    </div>\n</body>`);
                    msg = "Bloco estrutural adicionado antes de </body>";
                    return { novoHtml, mensagem: msg };
                }
            }

            // 3. Fallback genérico: se não achar padrão específico, injeta como comentário e marcação estrutural
            if (html.includes('</body>')) {
                novoHtml = html.replace('</body>', `    <!-- TODO: ${melhoria} -->\n</body>`);
                msg = "Ponto de marcação adicionado antes de </body>";
            } else {
                novoHtml += `\n<!-- Melhoria aplicada: ${melhoria} -->`;
                msg = "Adicionado ao final do documento";
            }

            return { novoHtml, mensagem: msg };
        }
    </script>
</body>
</html>
