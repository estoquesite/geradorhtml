<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteiro Europa - Mariana</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<main class="max-w-3xl mx-auto p-5 sm:p-8">
  <div class="bg-slate-900 text-white rounded-3xl p-6 shadow-xl mb-5">
    <div class="text-3xl mb-2">🚄</div>
    <h1 class="text-2xl font-black">Roteiro Europa - Mariana</h1>
    <p class="text-slate-300 text-sm mt-1">Escolha a área que deseja abrir.</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <a href="roteiro.html" class="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 hover:shadow-lg transition">
      <div class="text-3xl mb-3">✈️</div><h2 class="font-black text-lg">Roteiro</h2>
      <p class="text-sm text-slate-500 mt-1">Visualização do roteiro oficial aprovado.</p>
    </a>
    <a href="editar.html" class="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 hover:shadow-lg transition">
      <div class="text-3xl mb-3">📅</div><h2 class="font-black text-lg">Editar</h2>
      <p class="text-sm text-slate-500 mt-1">Criar e alterar blocos e informações do roteiro.</p>
    </a>
    <a href="orcamento.html" class="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 hover:shadow-lg transition">
      <div class="text-3xl mb-3">💰</div><h2 class="font-black text-lg">Orçamento</h2>
      <p class="text-sm text-slate-500 mt-1">Despesas, câmbio, saldos e divisão de gastos.</p>
    </a>
    <a href="agenda.html" class="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 hover:shadow-lg transition">
      <div class="text-3xl mb-3">🗓️</div><h2 class="font-black text-lg">Agenda</h2>
      <p class="text-sm text-slate-500 mt-1">Calendário e montagem das etapas de cada dia.</p>
    </a>
  </div>
</main>
</body>
</html>
