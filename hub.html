<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteiro Europa - Hub de Utilidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta name="theme-color" content="#4c1d95">
    <style>
        button, a, label, select, input { -webkit-tap-highlight-color: transparent; }
        button:active, a:active { transform: scale(0.97); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24 select-none">

    <div id="toast-container" class="fixed top-4 right-4 z-[999] flex flex-col gap-2 pointer-events-none"></div>

    <header class="bg-indigo-950 text-white px-3 py-2.5 shadow-md border-b border-indigo-900/50 text-xs flex justify-between items-center z-50 sticky top-0">
        <span class="font-bold flex items-center gap-1.5">
            <span>📋</span> Hub de Utilidades & Vouchers
        </span>
        <a href="principal.html" class="bg-indigo-900 hover:bg-indigo-800 text-white px-2.5 py-1.5 rounded-lg font-bold text-[10px] border border-indigo-700">🏠 Início</a>
    </header>

    <div class="max-w-4xl mx-auto p-3 sm:p-6 space-y-4 pt-4">

        <!-- Barra de Filtros de Seção do Hub -->
        <div class="flex gap-1.5 overflow-x-auto no-scrollbar bg-slate-200/80 p-2 rounded-2xl shadow-inner border border-slate-300">
            <button onclick="filtrarHub('todos')" id="btn-filt-todos" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white font-bold text-xs shrink-0">🔍 Todos</button>
            <button onclick="filtrarHub('voos')" id="btn-filt-voos" class="px-3 py-1.5 rounded-xl bg-white text-slate-700 font-bold text-xs shrink-0">✈️ Voos</button>
            <button onclick="filtrarHub('contatos')" id="btn-filt-contatos" class="px-3 py-1.5 rounded-xl bg-white text-slate-700 font-bold text-xs shrink-0">📞 Contatos</button>
            <button onclick="filtrarHub('tarefas')" id="btn-filt-tarefas" class="px-3 py-1.5 rounded-xl bg-white text-slate-700 font-bold text-xs shrink-0">📋 Tarefas</button>
            <button onclick="filtrarHub('checklist')" id="btn-filt-checklist" class="px-3 py-1.5 rounded-xl bg-white text-slate-700 font-bold text-xs shrink-0">🎒 Checklist</button>
            <button onclick="filtrarHub('vouchers')" id="btn-filt-vouchers" class="px-3 py-1.5 rounded-xl bg-white text-slate-700 font-bold text-xs shrink-0">🎟️ Vouchers</button>
        </div>

        <!-- 1. VOOS & PASSAGENS -->
        <div id="card-voos" class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-extrabold text-xs uppercase text-indigo-950 flex items-center gap-1.5"><span>✈️</span> Voos & Passagens</h3>
                <button onclick="adicionarVoo()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-xl text-xs font-bold active:scale-95">➕ Voo</button>
            </div>
            <div id="lista-voos" class="space-y-2"></div>
        </div>

        <!-- 2. CONTATOS ÚTEIS -->
        <div id="card-contatos" class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-extrabold text-xs uppercase text-indigo-950 flex items-center gap-1.5"><span>📞</span> Contatos de Emergência & Apoio</h3>
                <button onclick="adicionarContato()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-xl text-xs font-bold active:scale-95">➕ Contato</button>
            </div>
            <div id="lista-contatos" class="space-y-2"></div>
        </div>

        <!-- 3. TAREFAS -->
        <div id="card-tarefas" class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-extrabold text-xs uppercase text-indigo-950 flex items-center gap-1.5"><span>📋</span> Tarefas & Pendências</h3>
                <button onclick="adicionarTarefa()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-xl text-xs font-bold active:scale-95">➕ Tarefa</button>
            </div>
            <div id="lista-tarefas" class="space-y-2"></div>
        </div>

        <!-- 4. CHECKLIST -->
        <div id="card-checklist" class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-extrabold text-xs uppercase text-indigo-950 flex items-center gap-1.5"><span>🎒</span> Checklist de Malas</h3>
                <button onclick="adicionarItemChecklist()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-xl text-xs font-bold active:scale-95">➕ Item</button>
            </div>
            <div id="lista-checklist" class="space-y-2"></div>
        </div>

        <!-- 5. VOUCHERS -->
        <div id="card-vouchers" class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-extrabold text-xs uppercase text-indigo-950 flex items-center gap-1.5"><span>🎟️</span> Vouchers & Documentos</h3>
                <button onclick="adicionarVoucher()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-xl text-xs font-bold active:scale-95">➕ Voucher</button>
            </div>
            <div id="lista-vouchers" class="space-y-2"></div>
        </div>
    </div>

    <!-- NAVEGAÇÃO FIXA INFERIOR -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md text-white px-3 py-2 shadow-2xl border-t border-slate-800 flex items-center justify-around gap-1 max-w-4xl mx-auto rounded-t-2xl">
        <a href="principal.html" class="py-1 px-3 rounded-xl hover:bg-slate-800 text-slate-300 font-extrabold text-[11px] flex flex-col items-center">
            <span>🏠</span><span class="text-[9px]">Início</span>
        </a>
        <a href="roteiro.html" class="py-1 px-3 rounded-xl hover:bg-slate-800 text-slate-300 font-extrabold text-[11px] flex flex-col items-center">
            <span>✈️</span><span class="text-[9px]">Roteiro</span>
        </a>
        <a href="hub.html" class="py-1 px-3 rounded-xl bg-indigo-600 text-white font-extrabold text-[11px] flex flex-col items-center">
            <span>📋</span><span class="text-[9px]">Hub</span>
        </a>
        <a href="orcamento.html" class="py-1 px-3 rounded-xl hover:bg-slate-800 text-slate-300 font-extrabold text-[11px] flex flex-col items-center">
            <span>💰</span><span class="text-[9px]">Orçamento</span>
        </a>
        <a href="compras.html" class="py-1 px-3 rounded-xl hover:bg-slate-800 text-slate-300 font-extrabold text-[11px] flex flex-col items-center">
            <span>🛍️</span><span class="text-[9px]">Compras</span>
        </a>
    </nav>

    <script>
        const SUPABASE_URL = 'https://jmeepzdvmmjngxwvayqb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_54ORrLbP7naW7n-KlKCdUA_hZnpjguH';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const CHAVE_APP = "mariana_viagem_europa_dados_fixos_definitiva";

        let dadosApp = { voos: [], contatos: [], tarefas: [], checklist: [], vouchers: [] };
        let hubFiltro = 'todos';

        function mostrarToast(msg) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `bg-emerald-600 text-white px-4 py-2 rounded-2xl shadow-xl font-bold text-xs pointer-events-auto`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        async function salvarStorage() {
            localStorage.setItem(CHAVE_APP, JSON.stringify(dadosApp));
            try { await supabaseClient.from('app_dados').upsert({ id: '1', conteudo: dadosApp }); } catch(e){}
        }

        async function carregarDados() {
            try {
                let { data } = await supabaseClient.from('app_dados').select('conteudo').eq('id', '1').single();
                if (data && data.conteudo) dadosApp = data.conteudo;
                else {
                    let local = localStorage.getItem(CHAVE_APP);
                    if (local) dadosApp = JSON.parse(local);
                }
            } catch(e) {
                let local = localStorage.getItem(CHAVE_APP);
                if (local) dadosApp = JSON.parse(local);
            }
            renderizarHub();
        }

        function filtrarHub(aba) {
            hubFiltro = aba;
            ['voos', 'contatos', 'tarefas', 'checklist', 'vouchers'].forEach(tipo => {
                let card = document.getElementById('card-' + tipo);
                if (card) {
                    if (aba === 'todos' || aba === tipo) card.classList.remove('hidden');
                    else card.classList.add('hidden');
                }
            });
        }

        function renderizarHub() {
            renderizarVoos();
            renderizarContatos();
            renderizarTarefas();
            renderizarChecklist();
            renderizarVouchers();
        }

        // Voos
        function renderizarVoos() {
            const c = document.getElementById('lista-voos');
            if (!c) return;
            c.innerHTML = (dadosApp.voos || []).map(v => `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl flex justify-between items-center text-xs">
                    <div>
                        <span class="font-black text-indigo-950">${v.cia || 'Cia'} ${v.voo || ''}</span>
                        <p class="text-[11px] text-slate-500">${v.rota || ''} • PNR: <b class="text-amber-800">${v.pnr || '-'}</b></p>
                    </div>
                    <button onclick="excluirItem('voos', ${v.id})" class="text-rose-600 font-bold">✕</button>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">Nenhum voo adicionado.</p>';
        }

        function adicionarVoo() {
            let rota = prompt("Qual a rota do voo? (ex: GIG -> ZRH)", "GIG -> ZRH");
            if (!rota) return;
            if (!dadosApp.voos) dadosApp.voos = [];
            dadosApp.voos.unshift({ id: Date.now(), cia: "Latam", voo: "LA8000", rota: rota, pnr: "ABC123" });
            salvarStorage(); renderizarVoos(); mostrarToast("Voo adicionado!");
        }

        // Contatos
        function renderizarContatos() {
            const c = document.getElementById('lista-contatos');
            if (!c) return;
            c.innerHTML = (dadosApp.contatos || []).map(ct => `
                <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-2xl flex justify-between items-center text-xs">
                    <span class="font-bold">${ct.nome} (${ct.numero})</span>
                    <div class="flex gap-2">
                        <a href="tel:${ct.numero}" class="bg-emerald-600 text-white px-2 py-1 rounded-lg font-bold text-[10px]">📞 Ligar</a>
                        <button onclick="excluirItem('contatos', ${ct.id})" class="text-rose-600 font-bold">✕</button>
                    </div>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">Nenhum contato adicionado.</p>';
        }

        function adicionarContato() {
            let nome = prompt("Nome do contato:");
            let tel = prompt("Telefone:");
            if (!nome) return;
            if (!dadosApp.contatos) dadosApp.contatos = [];
            dadosApp.contatos.unshift({ id: Date.now(), nome: nome, numero: tel || "" });
            salvarStorage(); renderizarContatos(); mostrarToast("Contato salvo!");
        }

        // Tarefas
        function renderizarTarefas() {
            const c = document.getElementById('lista-tarefas');
            if (!c) return;
            c.innerHTML = (dadosApp.tarefas || []).map(t => `
                <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-2xl flex justify-between items-center text-xs">
                    <span class="font-bold">${t.texto}</span>
                    <button onclick="excluirItem('tarefas', ${t.id})" class="text-rose-600 font-bold">✕</button>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">Nenhuma tarefa adicionada.</p>';
        }

        function adicionarTarefa() {
            let txt = prompt("Qual a tarefa?");
            if (!txt) return;
            if (!dadosApp.tarefas) dadosApp.tarefas = [];
            dadosApp.tarefas.unshift({ id: Date.now(), texto: txt });
            salvarStorage(); renderizarTarefas(); mostrarToast("Tarefa criada!");
        }

        // Checklist
        function renderizarChecklist() {
            const c = document.getElementById('lista-checklist');
            if (!c) return;
            c.innerHTML = (dadosApp.checklist || []).map(item => `
                <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-2xl flex justify-between items-center text-xs">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" ${item.feito ? 'checked' : ''} onchange="alternarChecklist(${item.id})" class="w-4 h-4 accent-indigo-600">
                        <span class="${item.feito ? 'line-through text-slate-400' : 'font-bold'}">${item.item}</span>
                    </label>
                    <button onclick="excluirItem('checklist', ${item.id})" class="text-rose-600 font-bold">✕</button>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">Nenhum item no checklist.</p>';
        }

        function adicionarItemChecklist() {
            let it = prompt("Item para o checklist de mala:");
            if (!it) return;
            if (!dadosApp.checklist) dadosApp.checklist = [];
            dadosApp.checklist.push({ id: Date.now(), item: it, feito: false });
            salvarStorage(); renderizarChecklist(); mostrarToast("Item adicionado!");
        }

        function alternarChecklist(id) {
            let item = dadosApp.checklist.find(i => i.id === id);
            if (item) { item.feito = !item.feito; salvarStorage(); renderizarChecklist(); }
        }

        // Vouchers
        function renderizarVouchers() {
            const c = document.getElementById('lista-vouchers');
            if (!c) return;
            c.innerHTML = (dadosApp.vouchers || []).map(v => `
                <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-2xl flex justify-between items-center text-xs">
                    <span class="font-bold">${v.titulo}</span>
                    <button onclick="excluirItem('vouchers', ${v.id})" class="text-rose-600 font-bold">✕</button>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">Nenhum voucher registrado.</p>';
        }

        function adicionarVoucher() {
            let tit = prompt("Título do Voucher (ex: Hotel Zurich):");
            if (!tit) return;
            if (!dadosApp.vouchers) dadosApp.vouchers = [];
            dadosApp.vouchers.unshift({ id: Date.now(), titulo: tit });
            salvarStorage(); renderizarVouchers(); mostrarToast("Voucher registrado!");
        }

        function excluirItem(colecao, id) {
            if (confirm("Remover este item?")) {
                dadosApp[colecao] = (dadosApp[colecao] || []).filter(i => i.id !== id);
                salvarStorage();
                renderizarHub();
                mostrarToast("Item removido.", "info");
            }
        }

        window.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
