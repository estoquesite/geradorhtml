<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Hub - Hub de Listas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { lightBg: '#f8fafc', cardBg: '#ffffff', neonPink: '#ff007f' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-glow-pink { box-shadow: 0 0 15px rgba(255, 0, 127, 0.35); }
        .soft-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04); }
    </style>
</head>
<body class="bg-lightBg text-slate-700 min-h-screen pb-36 pt-4 font-sans selection:bg-sky-100 selection:text-sky-900">

    <!-- BARRA SUPERIOR DE VERSÃO -->
    <div class="w-full bg-slate-900 text-white py-2.5 px-6 flex justify-between items-center text-xs font-bold tracking-wider uppercase mb-6 shadow-md">
        <span>✈️ Roteiro Europa - Mariana</span>
        <span class="bg-neonPink px-2.5 py-0.5 rounded-full text-[10px] text-white neon-glow-pink">Versão 1</span>
    </div>

    <main class="w-full max-w-4xl mx-auto px-4 pt-2 space-y-4">
        <div class="bg-cardBg border border-slate-100 rounded-3xl p-5 soft-shadow">
            <h3 class="text-xs sm:text-sm font-bold tracking-wider text-slate-800 uppercase">📋 HUB DE LISTAS & VOUCHERS</h3>
            <p class="text-[11px] text-slate-400 mt-1">Gerencie suas listas de voos, contatos e tarefas.</p>
        </div>
    </main>

    <!-- BARRA FLUTUANTE INFERIOR -->
    <div id="floating-dock" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50">
        <nav class="bg-cardBg/95 backdrop-blur-md border border-slate-100 rounded-full px-6 py-3.5 flex items-center space-x-4 sm:space-x-8 soft-shadow shadow-xl">
            <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-neonPink transition-transform px-1"><span class="text-xl">🏠</span><span class="text-[10px] mt-1">Início</span></a>
            <div class="h-5 w-[1px] bg-slate-200"></div>
            <a href="roteiro.html" class="flex flex-col items-center text-slate-400 hover:text-neonPink transition-transform px-1"><span class="text-xl">✈️</span><span class="text-[10px] mt-1 font-semibold">Roteiro</span></a>
            <div class="h-5 w-[1px] bg-slate-200"></div>
            <a href="hub.html" class="flex flex-col items-center text-neonPink font-extrabold transition-transform px-1"><span class="text-xl">🎒</span><span class="text-[10px] mt-1">Hub</span></a>
            <div class="h-5 w-[1px] bg-slate-200"></div>
            <a href="orcamento.html" class="flex flex-col items-center text-slate-400 hover:text-neonPink transition-transform px-1"><span class="text-xl">💳</span><span class="text-[10px] mt-1 font-semibold">Orç.</span></a>
            <div class="h-5 w-[1px] bg-slate-200"></div>
            <a href="compras.html" class="flex flex-col items-center text-slate-400 hover:text-neonPink transition-transform px-1"><span class="text-xl">🛍️</span><span class="text-[10px] mt-1 font-semibold">Compras</span></a>
            <div class="h-5 w-[1px] bg-slate-200"></div>
            <a href="agenda.html" class="flex flex-col items-center text-slate-400 hover:text-neonPink transition-transform px-1"><span class="text-xl">📅</span><span class="text-[10px] mt-1 font-semibold">Agenda</span></a>
        </nav>
    </div>
</body>
</html>
